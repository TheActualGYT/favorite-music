<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garrett Jahnke</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e5e5e5;
    height: 100vh;
    overflow: hidden;
    background: #121212;
    position: relative;
  }

  /* Subtle moving purple/lavender gradient as secondary */
  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background: linear-gradient(
      45deg,
      #4c1d95,
      #7c3aed,
      #a78bfa,
      #c4b5fd,
      #8b5cf6,
      #6d28d9,
      #4c1d95
    );
    background-size: 400% 400%;
    animation: gradientMove 22s ease infinite;
    z-index: -2;
    opacity: 0.22;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 25% 30%, rgba(167, 139, 250, 0.08), transparent 45%),
                radial-gradient(circle at 75% 70%, rgba(109, 40, 217, 0.1), transparent 45%);
    z-index: -1;
    pointer-events: none;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem;
    height: 72px;
    background: rgba(26, 26, 26, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 100;
    position: relative;
  }

  .navbar::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, #4c1d95, #7c3aed, #a78bfa, #c4b5fd, #8b5cf6, #6d28d9);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #ffffff;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2.5px solid #ffffff;
    object-fit: cover;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 1.75rem;
    align-items: center;
  }

  .nav-item {
    position: relative;
  }

  .nav-item > a {
    color: #ccc;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.5rem 0;
    display: inline-block;
    transition: color 0.2s ease;
  }

  .nav-item > a:hover {
    color: #c4b5fd;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    min-width: 180px;
    border-radius: 10px;
    border: 1px solid #333;
    padding: 0.5rem 0;
    margin-top: 0.4rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 200;
  }

  .nav-item:hover .dropdown {
    display: block;
  }

  .dropdown a {
    display: block;
    padding: 0.65rem 1.2rem;
    color: #ddd;
    text-decoration: none;
    font-size: 0.9rem;
    transition: background 0.15s, color 0.15s;
  }

  .dropdown a:hover {
    background: #252525;
    color: #a78bfa;
  }

  .container {
    display: flex;
    height: calc(100vh - 72px);
  }

  .sidebar {
    width: 360px;
    background: rgba(22, 22, 22, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .sidebar::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, #4c1d95, #7c3aed, #a78bfa, #c4b5fd, #8b5cf6, #6d28d9);
  }

  .sidebar-header {
    padding: 1.4rem 1.6rem 0.8rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-header h2 {
    font-size: 1.15rem;
    font-weight: 600;
    color: #eee;
  }

  .add-btn {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    color: white;
    border: none;
    padding: 0.45rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
  }

  .add-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.45);
  }

  .search-box {
    margin: 0 1.6rem 1.2rem;
    padding: 0.75rem 1rem;
    background: #1f1f1f;
    border: 1px solid #333;
    border-radius: 10px;
    color: #fff;
    font-size: 0.95rem;
    width: calc(100% - 3.2rem);
    transition: border-color 0.2s;
  }

  .search-box:focus {
    outline: none;
    border-color: #a78bfa;
  }

  .song-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    padding-bottom: 1rem;
  }

  .song-item {
    margin: 0 0.8rem;
    padding: 1rem 1.2rem;
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 0.3rem;
    transition: background 0.2s ease, transform 0.2s ease;
    border: 1px solid transparent;
  }

  .song-item:hover {
    background: #252525;
    transform: translateX(3px);
  }

  .song-item.selected {
    background: #2a2438;
    border-left: 3px solid #a78bfa;
    transform: translateX(3px);
  }

  .song-title { font-weight: 600; font-size: 0.98rem; color: #fff; }
  .song-artist { font-size: 0.85rem; color: #aaa; margin-top: 2px; }

  .empty-message {
    padding: 3rem 1.6rem;
    text-align: center;
    color: #888;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .main-content {
    flex: 1;
    overflow-y: auto;
    background: #121212;
    padding: 2.5rem;
  }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #777;
    font-size: 1.15rem;
    text-align: center;
  }

  .song-details {
    max-width: 740px;
    margin: 0 auto;
    animation: fadeUp 0.35s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .song-details h1 {
    font-size: 2.6rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
    line-height: 1.1;
    color: #fff;
  }

  .artist {
    font-size: 1.45rem;
    color: #bbb;
    margin-bottom: 2rem;
    font-weight: 500;
  }

  .details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .detail-card {
    background: #1a1a1a;
    padding: 1.1rem 1.3rem;
    border-radius: 12px;
    border: 1px solid #2a2a2a;
    transition: transform 0.2s ease, border-color 0.2s;
  }

  .detail-card:hover {
    transform: translateY(-2px);
    border-color: #3a3a3a;
  }

  .detail-label {
    font-size: 0.72rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.35rem;
  }

  .detail-value { font-size: 1.05rem; font-weight: 500; color: #eee; }
  .rating { color: #fbbf24; letter-spacing: 1px; }

  .notes {
    background: #1a1a1a;
    padding: 1.6rem;
    border-radius: 12px;
    line-height: 1.7;
    color: #ddd;
    border: 1px solid #2a2a2a;
  }

  .notes h3 { margin-bottom: 0.75rem; font-size: 1.1rem; color: #fff; }

  .delete-btn {
    margin-top: 2rem;
    background: transparent;
    color: #f87171;
    border: 1px solid #e74c3c;
    padding: 0.65rem 1.3rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .delete-btn:hover {
    background: rgba(231, 76, 60, 0.15);
    color: #fff;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .modal.active { display: flex; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: #1e1e1e;
    padding: 2.2rem;
    border-radius: 16px;
    width: 90%;
    max-width: 480px;
    border: 1px solid #333;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    animation: modalPop 0.3s ease;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-content h2 {
    margin-bottom: 1.5rem;
    color: #fff;
  }

  .form-group { margin-bottom: 1rem; }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 0.4rem;
  }

  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 0.75rem;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: white;
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }

  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    outline: none;
    border-color: #a78bfa;
  }

  .form-group textarea { min-height: 80px; resize: vertical; }

  .modal-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }

  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.5);
  }

  .btn-secondary {
    background: transparent;
    color: #aaa;
    border: 1px solid #444;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-secondary:hover {
    background: #2a2a2a;
  }

  /* Subtle scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <img class="avatar" src="avatar.png" alt="Garrett Jahnke">
      Garrett Jahnke
    </div>
    <ul class="nav-links">
      <li class="nav-item">
        <a href="#">Rankings</a>
        <div class="dropdown">
          <a href="#">Top Songs</a>
          <a href="#">Top Artists</a>
          <a href="#">Top Albums</a>
        </div>
      </li>
      <li class="nav-item">
        <a href="#">Directory</a>
        <div class="dropdown">
          <a href="#">All Songs</a>
          <a href="#">All Artists</a>
          <a href="#">All Albums</a>
        </div>
      </li>
    </ul>
  </nav>

  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Songs</h2>
        <button class="add-btn" id="addBtn">+ Add</button>
      </div>
      <input type="text" class="search-box" id="search" placeholder="Search songs...">
      <ul class="song-list" id="songList"></ul>
      <div class="empty-message" id="emptyMessage">
        No favorite songs yet.<br>Click <strong>+ Add</strong> to get started.
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="placeholder">Select a song from the list to view details</div>
    </main>
  </div>

  <!-- Add Song Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add a Song</h2>
      <form id="songForm">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label>Artist *</label>
          <input type="text" id="artist" required>
        </div>
        <div class="form-group">
          <label>Album</label>
          <input type="text" id="album">
        </div>
        <div class="form-group">
          <label>Year</label>
          <input type="number" id="year" min="1900" max="2100">
        </div>
        <div class="form-group">
          <label>Genre</label>
          <input type="text" id="genre">
        </div>
        <div class="form-group">
          <label>Rating</label>
          <select id="rating">
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★☆ (4)</option>
            <option value="3">★★★☆☆ (3)</option>
            <option value="2">★★☆☆☆ (2)</option>
            <option value="1">★☆☆☆☆ (1)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="notes" placeholder="Why do you love this song?"></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Add Song</button>
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let songs = JSON.parse(localStorage.getItem("favoriteSongs")) || [];
    let selectedId = null;

    const songList = document.getElementById("songList");
    const emptyMessage = document.getElementById("emptyMessage");
    const mainContent = document.getElementById("mainContent");
    const searchInput = document.getElementById("search");
    const modal = document.getElementById("modal");
    const songForm = document.getElementById("songForm");

    function save() {
      localStorage.setItem("favoriteSongs", JSON.stringify(songs));
    }

    function renderList(filter = "") {
      const filtered = songs.filter(s =>
        s.title.toLowerCase().includes(filter.toLowerCase()) ||
        s.artist.toLowerCase().includes(filter.toLowerCase())
      );

      songList.innerHTML = "";

      if (filtered.length === 0) {
        emptyMessage.style.display = "block";
        songList.style.display = "none";
      } else {
        emptyMessage.style.display = "none";
        songList.style.display = "block";
        filtered.forEach(song => {
          const li = document.createElement("li");
          li.className = "song-item" + (song.id === selectedId ? " selected" : "");
          li.innerHTML = `
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          `;
          li.onclick = () => selectSong(song.id);
          songList.appendChild(li);
        });
      }
    }

    function selectSong(id) {
      selectedId = id;
      const song = songs.find(s => s.id === id);
      if (!song) return;

      const stars = "★".repeat(song.rating) + "☆".repeat(5 - song.rating);

      mainContent.innerHTML = `
        <div class="song-details">
          <h1>${song.title}</h1>
          <div class="artist">${song.artist}</div>
          <div class="details-grid">
            ${song.album ? `<div class="detail-card"><div class="detail-label">Album</div><div class="detail-value">${song.album}</div></div>` : ""}
            ${song.year ? `<div class="detail-card"><div class="detail-label">Year</div><div class="detail-value">${song.year}</div></div>` : ""}
            ${song.genre ? `<div class="detail-card"><div class="detail-label">Genre</div><div class="detail-value">${song.genre}</div></div>` : ""}
            <div class="detail-card">
              <div class="detail-label">Rating</div>
              <div class="detail-value rating">${stars}</div>
            </div>
          </div>
          ${song.notes ? `<div class="notes"><h3>Notes</h3><p>${song.notes}</p></div>` : ""}
          <button class="delete-btn" onclick="deleteSong(${song.id})">Delete Song</button>
        </div>
      `;
      renderList(searchInput.value);
    }

    function deleteSong(id) {
      if (confirm("Delete this song?")) {
        songs = songs.filter(s => s.id !== id);
        save();
        selectedId = null;
        mainContent.innerHTML = `<div class="placeholder">Select a song from the list to view details</div>`;
        renderList(searchInput.value);
      }
    }

    // Modal
    document.getElementById("addBtn").onclick = () => modal.classList.add("active");
    document.getElementById("cancelBtn").onclick = () => modal.classList.remove("active");
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("active"); };

    songForm.onsubmit = (e) => {
      e.preventDefault();
      const song = {
        id: Date.now(),
        title: document.getElementById("title").value.trim(),
        artist: document.getElementById("artist").value.trim(),
        album: document.getElementById("album").value.trim(),
        year: document.getElementById("year").value || null,
        genre: document.getElementById("genre").value.trim(),
        rating: parseInt(document.getElementById("rating").value),
        notes: document.getElementById("notes").value.trim()
      };
      songs.unshift(song);
      save();
      songForm.reset();
      modal.classList.remove("active");
      renderList();
      selectSong(song.id);
    };

    searchInput.oninput = () => renderList(searchInput.value);

    // Initial render
    renderList();
  </script>
</body>
</html>
